name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so new tournament results reach the rankings.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the LD rankings from the public results dataset; keep the committed data if that fails.
      - run: npm run rankings || (git checkout -- public/data && echo "::warning::Rankings refresh failed; deploying the committed data")
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      # Pages has no SPA fallback, so the app uses hash routes (/#/app/...).
      # Assets are served from /<repo-name>/.
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
        env:
          VITE_HASH_ROUTER: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
