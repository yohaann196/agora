name: Sync rankings and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every Monday, after the weekend's tournaments: pull the latest results from the
  # source datasets, rebuild the rankings and redeploy.
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Clones shreerammodi/debate-rankings and skumar-ml/debate-rankings, merges them with
      # data/uploads, and writes public/data/ld. If a source can't be reached the job fails
      # and the last good deployment stays live.
      - run: npm run rankings
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      # Pages has no SPA fallback, so the app uses hash routes (/#/app/...).
      # Assets are served from /<repo-name>/.
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
        env:
          VITE_HASH_ROUTER: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
