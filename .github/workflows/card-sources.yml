# Temporary: finds and fetches open-access sources for the evidence library (the dev sandbox
# can't reach the open web). Removed once the cards are cut.
name: Card sources

on:
  push:
    branches: [claude/philosophyos-web-app-f3ynd7]
    paths: [scripts/cards/**, .github/workflows/card-sources.yml]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Discovery first; once scripts/cards/sources.json lists the picks, fetch their full text.
      - run: if [ -f scripts/cards/sources.json ]; then node scripts/cards/fetch.mjs; else node scripts/cards/discover.mjs; fi
